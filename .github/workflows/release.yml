name: release

on:
  # Каждый мерж в main — релиз; версию считает .github/scripts/next-version.sh.
  push:
    branches: [main]
    paths-ignore: ['docs/**', '**.md']
  # Артефакты без релиза — для приёмки (S10).
  workflow_dispatch:

permissions:
  contents: read

# Прогоны идут по очереди: следующий видит тег предыдущего. Ожидать может только один —
# при серии мержей промежуточные отменяются, но их коммиты попадают в следующий релиз.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    outputs:
      version: ${{ steps.version.outputs.version }}
      release_id: ${{ steps.release.outputs.id }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: version
        run: echo "version=$(.github/scripts/next-version.sh)" >> "$GITHUB_OUTPUT"
      # Тег ставим сразу: черновик релиза тег не создаёт, и упавшая сборка иначе
      # отдала бы ту же версию следующему прогону.
      - id: release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: v${{ steps.version.outputs.version }}
        run: |
          git tag "$TAG" "$GITHUB_SHA"
          git push origin "$TAG"
          id="$(gh api -X POST "repos/${GITHUB_REPOSITORY}/releases" \
            -f tag_name="$TAG" -f name="Longpole $TAG" \
            -F draft=true -F generate_release_notes=true --jq .id)"
          echo "id=$id" >> "$GITHUB_OUTPUT"

  build:
    needs: prepare
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS arm64
            os: macos-14
            target: aarch64-apple-darwin
            bundles: dmg
          - name: macOS x64
            os: macos-14
            target: x86_64-apple-darwin
            bundles: dmg
          - name: Windows x64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            bundles: nsis
          - name: Linux x64
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            bundles: appimage,deb
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    env:
      # NASM на Windows не ставим: aws-lc-sys (через rustls) берёт готовые объектники из крейта.
      AWS_LC_SYS_PREBUILT_NASM: 1
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Системные зависимости Tauri
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      # Тулчейн из app/rust-toolchain.toml — до кеша (см. ci.yml); цель добавляем явно для кросс-сборки.
      - run: |
          rustup toolchain install
          rustup default "$(rustup show active-toolchain | cut -d' ' -f1)"
          rustup target add ${{ matrix.target }}
        shell: bash
        working-directory: app
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app
          key: ${{ matrix.target }}

      - run: npm ci
        working-directory: app
      # Версия приложения = версия релиза; в репозиторий не коммитится.
      - run: npm version "${{ needs.prepare.outputs.version }}" --no-git-tag-version --allow-same-version
        working-directory: app

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: app
          args: --target ${{ matrix.target }} --bundles ${{ matrix.bundles }}
          # На dispatch releaseId пуст — tauri-action только собирает, никуда не загружает.
          releaseId: ${{ needs.prepare.outputs.release_id }}

      - uses: actions/upload-artifact@v4
        if: github.event_name == 'workflow_dispatch'
        with:
          name: longpole-${{ matrix.target }}
          path: |
            app/target/${{ matrix.target }}/release/bundle/dmg/*.dmg
            app/target/${{ matrix.target }}/release/bundle/nsis/*.exe
            app/target/${{ matrix.target }}/release/bundle/appimage/*.AppImage
            app/target/${{ matrix.target }}/release/bundle/deb/*.deb
          if-no-files-found: error

  # Публикуем, только когда собрались все платформы; иначе релиз остаётся черновиком.
  publish:
    needs: [prepare, build]
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api -X PATCH "repos/${GITHUB_REPOSITORY}/releases/${{ needs.prepare.outputs.release_id }}" \
            -F draft=false -f make_latest=true --silent
