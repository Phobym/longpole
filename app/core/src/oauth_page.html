<!doctype html>
<html lang="en" data-state="__STATE__">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Longpole</title>
<!-- без иконки браузер запросил бы /favicon.ico у слушателя, который уже закрыт -->
<link rel="icon" href="data:,">
<style>
  /* токены приложения: app/src/shared/ui/theme.css */
  :root {
    --bg: #ffffff;
    --fg: #1d1d1f;
    --muted: #636368;
    --mascot: #e8701a;
    --eye: #1c2333;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #1e1e1e; --fg: #f5f5f7; --muted: #a1a1a6; --mascot: #ff8a3d; }
  }
  * { margin: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    display: grid;
    place-items: center;
    padding: 24px;
    background: var(--bg);
    color: var(--fg);
    font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  main {
    display: flex;
    align-items: center;
    gap: 28px;
    max-width: 560px;
  }
  svg { flex: none; width: 112px; height: auto; color: var(--mascot); }
  h1 { font-size: 28px; line-height: 1.2; font-weight: 600; letter-spacing: -0.015em; }
  p { margin-top: 8px; color: var(--muted); max-width: 44ch; text-wrap: pretty; }

  /* шея — полоски трейса: при успехе завершаются снизу вверх, затем поднимается голова */
  .bar { opacity: var(--o); }
  [data-state="ok"] .bar {
    animation: done 360ms cubic-bezier(.2, .7, .3, 1) both;
    animation-delay: calc(var(--i) * 110ms);
    transform-box: fill-box;
    transform-origin: left;
  }
  [data-state="ok"] .head {
    animation: rise 420ms cubic-bezier(.2, .7, .3, 1) 480ms both;
    transform-box: fill-box;
    transform-origin: 20% 90%;
  }
  @keyframes done { from { transform: scaleX(0); opacity: .15; } }
  @keyframes rise { from { transform: translateY(6px) rotate(8deg); opacity: 0; } }
  /* отказ: голова опущена, как у жирафа ошибок в приложении */
  [data-state="fail"] .head { transform: rotate(20deg); transform-origin: 53px 44px; }
  [data-state="ok"] .sad, [data-state="fail"] .eye { display: none; }
  @media (prefers-reduced-motion: reduce) {
    .bar, .head { animation: none !important; }
  }
  @media (max-width: 480px) {
    main { flex-direction: column; text-align: center; gap: 20px; }
    svg { width: 88px; }
  }
</style>
</head>
<body>
<main>
  <svg viewBox="14 8 72 82" aria-hidden="true">
    <g fill="currentColor">
      <rect class="bar" x="18" y="78" width="30" height="9" rx="3" style="--i:0;--o:.55"/>
      <rect class="bar" x="26" y="67" width="28" height="9" rx="3" style="--i:1;--o:.7"/>
      <rect class="bar" x="34" y="56" width="26" height="9" rx="3" style="--i:2;--o:.85"/>
      <rect class="bar" x="42" y="45" width="22" height="9" rx="3" style="--i:3;--o:1"/>
      <g class="head">
        <path d="M44 42 C44 33 50 28 58 28 L76 33 C83 35 84 44 77 46 L60 47 C52 48 46 47 44 42 Z"/>
        <circle cx="48" cy="17" r="3.6"/>
        <circle cx="57" cy="16" r="3.6"/>
        <ellipse cx="44" cy="31" rx="6" ry="3" transform="rotate(-25 44 31)"/>
        <path d="M50 30 L48 18 M57 29 L57 17" fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round"/>
        <circle class="eye" cx="62" cy="35" r="2.6" fill="var(--eye)"/>
        <path class="sad" d="M59.5 35 q2.6 2 5.2 0" fill="none" stroke="var(--eye)" stroke-width="1.6" stroke-linecap="round"/>
      </g>
    </g>
  </svg>
  <div>
    <h1 id="title">Signed in</h1>
    <p id="text">Head back to Longpole. You can close this tab.</p>
  </div>
</main>
<script>
  // язык — по браузеру: страницу отдаёт локальный слушатель, настроек приложения он не знает
  const T = {
    ok: {
      ru: ['Вход выполнен', 'Возвращайся в Longpole — эту вкладку можно закрыть.'],
      en: ['Signed in', 'Head back to Longpole. You can close this tab.'],
      de: ['Angemeldet', 'Zurück zu Longpole – dieser Tab kann geschlossen werden.'],
      es: ['Sesión iniciada', 'Vuelve a Longpole. Puedes cerrar esta pestaña.'],
      fr: ['Connexion réussie', 'Revenez dans Longpole. Vous pouvez fermer cet onglet.'],
      it: ['Accesso effettuato', 'Torna a Longpole. Puoi chiudere questa scheda.'],
      ja: ['サインインしました', 'Longpole に戻ってください。このタブは閉じてかまいません。'],
      zh: ['已登录', '请返回 Longpole，可以关闭此标签页。'],
    },
    fail: {
      ru: ['Вход не выполнен', 'Причина — в Longpole, там же можно начать заново. Эту вкладку можно закрыть.'],
      en: ['Sign-in not completed', 'Longpole shows the reason and lets you try again. You can close this tab.'],
      de: ['Anmeldung nicht abgeschlossen', 'Longpole zeigt den Grund und einen neuen Versuch. Dieser Tab kann geschlossen werden.'],
      es: ['No se completó el inicio de sesión', 'Longpole muestra el motivo y permite reintentar. Puedes cerrar esta pestaña.'],
      fr: ['Connexion non aboutie', 'Longpole affiche la raison et permet de réessayer. Vous pouvez fermer cet onglet.'],
      it: ['Accesso non completato', 'Longpole mostra il motivo e permette di riprovare. Puoi chiudere questa scheda.'],
      ja: ['サインインできませんでした', '理由は Longpole に表示され、やり直せます。このタブは閉じてかまいません。'],
      zh: ['登录未完成', '原因显示在 Longpole 中，可在那里重试。可以关闭此标签页。'],
    },
  }
  const state = document.documentElement.dataset.state
  const lang = navigator.languages.map((l) => l.slice(0, 2)).find((l) => l in T[state]) || 'en'
  const [title, text] = T[state][lang]
  document.documentElement.lang = lang
  document.title = title + ' — Longpole'
  document.getElementById('title').textContent = title
  document.getElementById('text').textContent = text
  // браузер закроет вкладку, только если её открыл скрипт; иначе вызов молча игнорируется
  if (state === 'ok') setTimeout(() => window.close(), 1500)
</script>
</body>
</html>
