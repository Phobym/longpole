name: ci

on:
  pull_request:
    paths-ignore: ['docs/**', '**.md']
  push:
    branches: [main]
    paths-ignore: ['docs/**', '**.md']

# Новый пуш в PR отменяет прошлый прогон; прогоны main доходят до конца — они сохраняют кеш.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Отладочная информация в CI не нужна: target/ и кеш меньше, линковка быстрее.
  CARGO_PROFILE_DEV_DEBUG: 0
  CARGO_PROFILE_TEST_DEBUG: 0

defaults:
  run:
    working-directory: app

jobs:
  check:
    # Не ubuntu-latest: смена образа молча обнуляет кеши Rust и apt.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint:fsd
      - run: npm run check:locales
      # До cargo: generate_context! требует dist/, шаблон отчёта — dist-report/.
      - run: npm run build

      - name: Системные зависимости Tauri
        uses: awalsh128/cache-apt-pkgs-action@v1.6.3
        with:
          packages: libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev
          version: 1
      # Тулчейн из app/rust-toolchain.toml — до кеша и по умолчанию: rust-cache считает ключ
      # по `rustc -vV` из корня репозитория, иначе туда попал бы stable раннера.
      - run: |
          rustup toolchain install
          rustup default "$(rustup show active-toolchain | cut -d' ' -f1)"
      # Кеш пишет только main; PR читают его и не забивают лимит своими копиями.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test -p pipeline-trace-core

      - name: Сгенерированное закоммичено
        run: |
          git status --porcelain -- src/shared/api/schema src/shared/api/fixtures
          test -z "$(git status --porcelain -- src/shared/api/schema src/shared/api/fixtures)"
