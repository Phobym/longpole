name: ci

on:
  # На PR CI не гоняем: проверки идут локально, в pre-commit (lefthook.yml).
  push:
    branches: [main]
    paths-ignore: ['docs/**', '**.md']

# Прогоны main доходят до конца — они сохраняют кеш.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false

env:
  # Отладочная информация в CI не нужна: target/ и кеш меньше, линковка быстрее.
  CARGO_PROFILE_DEV_DEBUG: 0
  CARGO_PROFILE_TEST_DEBUG: 0
  APT_PACKAGES: libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev

defaults:
  run:
    working-directory: app

jobs:
  check:
    # Не ubuntu-latest: смена образа молча обнуляет кеши Rust и apt.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint:fsd
      - run: npm run check:locales
      # До cargo: generate_context! требует dist/, шаблон отчёта — dist-report/.
      - run: npm run build

      # Списки пакетов в образе раннера отстают от зеркала (404 на заменённых .deb), а экшен
      # их не обновляет, если файлы свежие по mtime.
      - run: sudo apt-get update
      - name: Системные зависимости Tauri (кеш)
        uses: awalsh128/cache-apt-pkgs-action@v1.6.3
        with:
          packages: ${{ env.APT_PACKAGES }}
          version: 3
      # Экшен глотает ошибки apt (404 зеркала) и сохраняет пустой кеш — тогда ставим штатно.
      - name: Системные зависимости Tauri (проверка)
        run: |
          pkg-config --exists webkit2gtk-4.1 ayatana-appindicator3-0.1 librsvg-2.0 && exit 0
          echo "::warning::apt-кеш неполный, ставлю пакеты через apt-get"
          sudo apt-get update
          sudo apt-get install -y $APT_PACKAGES
      # Тулчейн из app/rust-toolchain.toml — до кеша и по умолчанию: rust-cache считает ключ
      # по `rustc -vV` из корня репозитория, иначе туда попал бы stable раннера.
      - run: |
          rustup toolchain install
          rustup default "$(rustup show active-toolchain | cut -d' ' -f1)"
      # Кеш пишет только main; PR читают его и не забивают лимит своими копиями.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test -p longpole-core

      - name: Сгенерированное закоммичено
        run: |
          git status --porcelain -- src/shared/api/schema src/shared/api/fixtures
          test -z "$(git status --porcelain -- src/shared/api/schema src/shared/api/fixtures)"
