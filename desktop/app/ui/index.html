<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#f7f8fa" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#111318" media="(prefers-color-scheme: dark)">
<title>pipeline-trace</title>
<link rel="stylesheet" href="form.css">
</head>
<body>
<div id="page">
  <aside id="history-col">
    <div class="hist-head">
      <h2>История</h2>
      <button type="button" id="history-clear" class="text-btn" hidden>Очистить</button>
    </div>
    <ul id="history-list"></ul>
    <p id="history-empty" class="muted">Пока пусто</p>
  </aside>

  <main id="form-col">
    <section class="card" id="screen-projects">
      <h1>Проекты</h1>

      <div class="field" id="field-url">
        <label for="url">Вставь ссылку на пайплайн или MR</label>
        <div class="host-row">
          <input type="url" id="url" placeholder="https://gitlab.example.com/group/project/-/pipelines/123…">
          <button type="button" id="build-link">Построить</button>
        </div>
        <p class="field-error" id="error-url" role="alert" hidden></p>
      </div>

      <div class="field" id="field-host">
        <label for="host-select">Хост</label>
        <div class="host-row">
          <select id="host-select" translate="no"></select>
          <button type="button" id="remove-token" hidden>Удалить токен</button>
        </div>
      </div>

      <p class="muted" id="token-hint" hidden>Добавь токен для этого хоста, чтобы смотреть список проектов.</p>
      <div class="field subform" id="field-new-host" hidden>
        <label for="new-host">Хост</label>
        <input type="text" id="new-host" translate="no" placeholder="gitlab.example.com">
        <label for="new-token">Токен</label>
        <input type="password" id="new-token" autocomplete="off" spellcheck="false">
        <p class="field-error" id="error-new-host" role="alert" hidden></p>
        <button type="button" id="save-token">Сохранить токен</button>
      </div>

      <div id="projects-panel" hidden>
        <div class="field">
          <label for="project-search">Поиск проекта</label>
          <input type="search" id="project-search" placeholder="Название или путь…">
        </div>
        <p id="projects-status" class="muted" aria-live="polite"></p>
        <p class="form-error" id="projects-error" role="alert" hidden></p>
        <ul id="project-list" class="proj-list"></ul>
        <button type="button" id="projects-more" class="text-btn" hidden>Показать ещё</button>
      </div>
    </section>

    <section class="card" id="screen-project" hidden>
      <div class="project-head">
        <button type="button" id="back-to-projects" class="text-btn">← Проекты</button>
        <h1 id="project-title" translate="no"></h1>
      </div>

      <div class="field">
        <label for="branch-input">Ветка</label>
        <input type="text" id="branch-input" list="branch-list" translate="no">
        <datalist id="branch-list"></datalist>
      </div>

      <p id="pipelines-status" class="muted" aria-live="polite"></p>
      <p class="form-error" id="pipelines-error" role="alert" hidden></p>
      <ul id="pipeline-list" class="pipe-list"></ul>
      <button type="button" id="pipelines-more" class="text-btn" hidden>Показать ещё</button>

      <div class="agg-block">
        <fieldset class="field" id="field-statuses">
          <legend>Статусы</legend>
          <label class="chk"><input type="checkbox" class="status-cb" value="SUCCESS" checked> SUCCESS</label>
          <label class="chk"><input type="checkbox" class="status-cb" value="MANUAL" checked> MANUAL</label>
          <label class="chk"><input type="checkbox" class="status-cb" value="FAILED"> FAILED</label>
          <label class="chk"><input type="checkbox" class="status-cb" value="CANCELED"> CANCELED</label>
          <label class="chk"><input type="checkbox" class="status-cb" value="RUNNING"> RUNNING</label>
          <label class="chk"><input type="checkbox" id="status-any" value="ANY"> любой</label>
          <p class="field-error" id="error-statuses" role="alert" hidden></p>
        </fieldset>

        <div class="field" id="field-last">
          <label for="last">Сколько пайплайнов</label>
          <input type="number" id="last" min="1" max="500" value="50">
          <p class="field-error" id="error-last" role="alert" hidden></p>
        </div>

        <button type="button" id="build-aggregate">Агрегат по 50 пайплайнам</button>
        <p class="form-error" id="aggregate-error" role="alert" hidden></p>
      </div>
    </section>
  </main>
</div>
<script src="form.js"></script>
</body>
</html>
