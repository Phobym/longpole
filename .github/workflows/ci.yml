name: ci

on:
  pull_request:
  push:
    branches: [main]

defaults:
  run:
    working-directory: app

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint:fsd
      - run: npm run check:locales
      # До cargo: generate_context! требует dist/, шаблон отчёта — dist-report/.
      - run: npm run build

      - name: Системные зависимости Tauri
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev
      # rustup ставит тулчейн и компоненты из app/rust-toolchain.toml при первом вызове cargo.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test -p pipeline-trace-core

      - name: Сгенерированное закоммичено
        run: |
          git status --porcelain -- src/shared/api/schema src/shared/api/fixtures
          test -z "$(git status --porcelain -- src/shared/api/schema src/shared/api/fixtures)"
